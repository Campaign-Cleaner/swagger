  /v1/get_credits:
    get:
      tags:
        - Campaign Cleaner
      summary: Get Credits
      description: >-
        The **get_credits** API will show you how many credits you currently
        have available. Credits are consumed by calling the **send_campaign**
        API endpoint.


        #### Response:


        - **Credits**: The amount of available credits you have on your account.
         

        In the event of any other error, you will get an "**error**:" response,
        with a description of the reason.
      parameters:
        - name: X-CC-API-Key
          in: header
          schema:
            type: string
          example: '{{api_key}}'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                credits: 987
  /v1/get_campaign_pdf_analysis:
    post:
      tags:
        - Campaign Cleaner
      summary: Get Campaign PDF Analysis
      description: >-
        The **get_campaign_pdf_analysis** API allows you to retrieve the analysis report for any of your Saved Campaigns in Campaign Cleaner.
     
        #### Header:
        
        **X-CC-API-Key**: Your API Key
        
        #### Request Body:

        **campaign**:

        - **id**: The campaign id that will be used in other API calls.
       
        #### Response:

        An Application/pdf stream.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campaign:
                  type: object
                  properties:
                    id:
                      type: string
              example:
                campaign:
                  id: '{{campaign_id}}'
      parameters:
        - name: X-CC-API-Key
          in: header
          schema:
            type: string
          example: '{{api_key}}'
      responses:
        '200':
          description: Returns the file in the PDF format
          content:
            application/pdf:
              schema:
                type: string
                format: binary
              example: 'PDF File Download'
  /v1/send_campaign:
    post:
      tags:
        - Campaign Cleaner
      summary: Send Campaign
      description: >-
        The **send_campaign** API Endpoint allows you to send in a campaign to
        be processed and analyzed by [Campaign
        Cleaner](https://campaigncleaner.com). Below is the list of settings
        that can be set, all optional settings, if not specified will default to
        the bold/italicized setting.


        All submitted campaigns will be sanitized.

        #### Header:
        
        **X-CC-API-Key**: Your API Key
        
        #### Request Body:


        _Required:_


        **send_campaign**:


        - **campaign_html** : The full HTML of your campaign

        - **campaign_name**: The name of your campaign - campaign name must pass
        our sanitization checks.
         

        Campaigns are normally processed in under 2 minutes, in most instances
        in a few seconds. But in some cases with very large campaigns with lots
        of images and links it can take longer to check those links for
        blacklists, redirects. image sizes and more. Depending on the server
        where those links resources are located it can take longer. The send
        campaign, will return a campaign ID once we received it, you can use
        that campaign ID to check on the status, and retrieve your campaign when
        it's finished processing or you can supply us a webhook URL and we will
        send the results to you automatically.


        _Optional:_


        **send_campaign**:


        - **adjust_font_colors**: (_**true**_/false), If true, certain bright
        colors are spam triggers, like "**red**" or "**#FF0000**", will be
        adjusted to a slightly different color like "**#FF0101"**, it will look
        the same, but won't trigger some spam filters.

        - **adjust_font_size**: (_**true**_/false) If true, you will be able to
        define the min and max font size allowed in pixels. If your newsletter
        contains larger or small font's it will adjust them to the min/max you
        define.

        - **convert_h_to_p_tags**: (true/**false**) If true, this will change
        all the H tags to P tags and set the correct font-size.

        - **convert_tables_to_divs:** (true/**false**) - This is an experimental
        feature to convert all the tables to divs, in certain instances with a
        complicated table structure you might need to edit the HTML. We
        recommend leaving this as false or not setting it.

        - **custom_info:** This field is for you to pass any additional data you
        want to send us, it will also be passed back to you when you call the
        get_campaign API. It's limited to 500 characters. - It must pass our
        sanitization checks.

        - **host_extensionless_images:** (true/**false**) If true, images
        without extensions will be hosted on our CDN when the resize_and_host
        parameter is set to true.

        - **inline_css:** (**true**/false) When set to true, CSS styles are
        directly applied within the style attribute of each HTML element.

        - **inline_css_important:** (true/**false**) When set to true, the
        !important flag will also be inlined with CSS styles.

        - **max_font_size_allowed**: (A positive Integer under 100) in pixels,
        default is 32.

        - **media_queries_important:** (**true**/false) When set to true, all
        media query styles will be marked with the !important flag.

        - **min_font_size_allowed**: (A positive Integer, under 100) in pixels,
        default is 10.

        - **preserve_media_queries**: (**true**/false) If true, all media
        queries will be preserved.

        - **relative_links_base_url**: If set, this needs to be a full base URL,
        if your email campaign has any relative paths, it will be converted to
        an absolute URL.

        - **remove_classes_and_ids**: (_**true**_/false) If true, all the class
        and ID attributes after CSS Inlining will be removed.

        - **remove_comments**: (**true**/false) If true, comments will be
        stripped from both CSS and HTML.

        - **remove_control_non_printable:** (true/**false**) If True, all
        non-printable and control characters are removed.

        - **remove_css_inheritance**: (**true**/false) If true, removes all
        elements of CSS that are inherited.

        - **remove_image_height:** (**true**/false) if true, the height style
        will be removed from all images.

        - **remove_large_widths_over**: (integer) Experimental: If set, removes
        all defined widths over the value set on non images and table tags.

        - **remove_successive_punctuation**: (**true**/false) if true, this will
        remove successive punctuation like ..., !!!!, $$$ to a single
        occurrence.

        - **replace_diacritics**: (**true**/false) If true, diacritic characters
        like á will be replaced with normal character equivalents.

        - **replace_non_ascii_characters**: (**true**/false) If true, all
        non-ascii characters will be replaced with their ascii equivalent.

        - **resize_and_host**: (**true**/false) If true, all eligible images
        will be resized, converted, and hosted on our CDN.

        - **set_image_max_width**: (integer) If set, applies a max-width style
        to all images in pixels.

        - **surrounding_div**: A surrounding div added to your html.
           - **max_width**: The max-width style in pixels applied to the surrounding div.
           - **text_align**: (left, center, right) Alignment of content within the div.
           - **font_size**: The pixel size set in the surrounding div.
           - **center_to_parent**: (true/false) If true, centers the div in any parent tags.

        - **webhook_url**: If provided, the results will be posted to this URL
        when processing is complete. Must be an absolute URL with no query
        string.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                send_campaign:
                  campaign_html: <html><body>Your Campaign HTML</body></html>
                  campaign_name: My Campaign
                  adjust_font_colors: true
                  adjust_font_size: true
                  min_font_size_allowed: 10
                  max_font_size_allowed: 32
                  convert_h_to_p_tags: false
                  convert_tables_to_divs: false
                  custom_info: ''
                  host_extensionless_images: false
                  inline_css: true
                  inline_css_important: false
                  media_queries_important: true
                  preserve_media_queries: true
                  relative_links_base_url: ''
                  remove_classes_and_ids: true
                  remove_comments: true
                  remove_control_non_printable: false
                  remove_css_inheritance: true
                  remove_image_height: true
                  remove_successive_punctuation: true
                  replace_diacritics: true
                  replace_non_ascii_characters: true
                  resize_and_host: true
                  webhook_url: ''
                  surrounding_div:
                    max_width: 600
                    text_align: left
                    font_size: 15
                    center_to_parent: true
      parameters:
        - name: X-CC-API-Key
          in: header
          schema:
            type: string
          example: '{{api_key}}'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                campaign:
                  id: 8e754ce1-c2df-11ed-9848-003048d8d533
  /v1/create_inbox_test:
    post:
      tags:
        - Campaign Cleaner
      summary: Create Inbox Test
      description: >-
        The **create_inbox_test** API allows you to create a new inbox placement
        test. Once created, you will receive a list of seed email addresses to
        send your campaign to. After sending your campaign to all addresses in
        the **send_to** list, you can use the **get_inbox_test_results** API to
        retrieve the placement results.


        This endpoint requires an active Campaign Cleaner subscription or a
        standalone Inbox Placement Tester subscription. One API credit will be
        deducted per test created.

        #### Header:

        **X-CC-API-Key**: Your API Key

        #### Request Body:

        _Required:_

        - **test_name**: The name of your inbox test - maximum 255 characters.

        #### Response:

        - **job_id**: The unique ID of the inbox test, used to retrieve results
        via the **get_inbox_test_results** API.

        - **test_name**: The name you provided for the test.

        - **mailtester_address**: The unique monitoring address that must be
        included in your send list. This is already included in the **send_to**
        array.

        - **instructions**: A description of what to do next.

        - **send_to**: An array of all seed email addresses including the
        **mailtester_address**. Send your campaign to every address in this
        list.


        In the event of an error, you will get an "**error**:" response with a
        description of the reason.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                test_name:
                  type: string
              example:
                test_name: My Campaign Inbox Test
      parameters:
        - name: X-CC-API-Key
          in: header
          schema:
            type: string
          example: '{{api_key}}'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                job_id: '12345'
                test_name: My Campaign Inbox Test
                mailtester_address: mailtest+a1b2c3d4@campaigncleaner.com
                instructions: >-
                  Send your campaign to ALL addresses in the send_to list.
                  Results will be available via get_inbox_test_results once
                  processing is complete.
                send_to:
                  - seed1@gmail.com
                  - seed2@yahoo.com
                  - seed3@outlook.com
                  - mailtest+a1b2c3d4@campaigncleaner.com
  /v1/get_inbox_test_results:
    post:
      tags:
        - Campaign Cleaner
      summary: Get Inbox Test Results
      description: >-
        The **get_inbox_test_results** API allows you to retrieve the placement
        results for an inbox test created via the **create_inbox_test** API.
        Results are populated as seed mailboxes receive your campaign, so you
        may call this endpoint multiple times until the **status** is
        _Completed_.


        A **status** of _Processing_ means not all seed mailboxes have received
        your campaign yet. Check back in a few minutes. If some seeds never
        receive the email, the **status** will remain _Processing_ — ensure your
        campaign was sent to all addresses in the **send_to** list.

        #### Header:

        **X-CC-API-Key**: Your API Key

        #### Request Body:

        _Required:_

        - **job_id**: The job ID returned from the **create_inbox_test** API.

        #### Response:

        - **job_id**: The unique ID of the inbox test.

        - **test_name**: The name of the inbox test.

        - **submitted_date**: The date and time the test was created.

        - **submitted_by**: The email address of the account that created the
        test.

        - **status**: Either _Processing_ or _Completed_.

        - **summary**: A high-level breakdown of results.
           - **total_seeds**: The total number of seed mailboxes in the test.
           - **received**: The number of seeds that have received the campaign so far.
           - **inbox**: The number of seeds where the campaign landed in the inbox.
           - **spam**: The number of seeds where the campaign landed in spam or junk.
           - **unknown_placement**: The number of seeds that received the email but placement could not be determined.
           - **pending**: The number of seeds still waiting to receive the campaign.
           - **inbox_rate**: The percentage of total seeds where the campaign landed in the inbox.
           - **spam_rate**: The percentage of total seeds where the campaign landed in spam.

        - **results**: A detailed per-seed breakdown.
           - **provider**: The email provider name (e.g. Gmail, Outlook, Yahoo).
           - **seed_address**: The seed email address.
           - **email_found**: (true/false) Whether the campaign was received by this seed.
           - **placement**: Where the campaign landed - Inbox, Spam, or Pending.
           - **spf_status**: The SPF authentication result for this seed.
           - **sender_ip**: The IP address the campaign was sent from.
           - **submission_result**: Additional detail about the submission result for this seed.


        In the event of an error, you will get an "**error**:" response with a
        description of the reason.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                job_id:
                  type: string
              example:
                job_id: '12345'
      parameters:
        - name: X-CC-API-Key
          in: header
          schema:
            type: string
          example: '{{api_key}}'
      responses:
        '200':
          description: OK
          headers:
            Content-Type:
              schema:
                type: string
                example: application/json
          content:
            application/json:
              schema:
                type: object
              example:
                job_id: '12345'
                test_name: My Campaign Inbox Test
                submitted_date: '2024-04-24T10:30:00'
                submitted_by: user@example.com
                status: Completed
                summary:
                  total_seeds: 30
                  received: 28
                  inbox: 24
                  spam: 3
                  unknown_placement: 1
                  pending: 2
                  inbox_rate: 80.0
                  spam_rate: 10.0
                results:
                  - provider: Gmail
                    seed_address: seed1@gmail.com
                    email_found: true
                    placement: Inbox
                    spf_status: pass
                    sender_ip: 192.168.1.1
                    submission_result: ''
                  - provider: Outlook
                    seed_address: seed2@outlook.com
                    email_found: true
                    placement: Spam
                    spf_status: pass
                    sender_ip: 192.168.1.1
                    submission_result: ''
                  - provider: Yahoo
                    seed_address: seed3@yahoo.com
                    email_found: false
                    placement: Pending
                    spf_status: ''
                    sender_ip: ''
                    submission_result: ''
